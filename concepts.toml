# ergon's own concept map (T-141): what each part of ergon is about. `concepts = "concepts.toml"`
# in .ergon.toml turns it on; skills/ergon/SKILL.md, "Concept map", says how it's used.
# Concerns first, then components, as arrays of tables with an id so that config.mini_toml reads
# it on Pythons without tomllib. `files` are fnmatch patterns (like [[protect]]); `fns` name the
# functions that implement a component; `introduced_by` is the task that creates it.

[[concern]]
id = "approval"
label = "Humans approve, agents execute"

[[concern]]
id = "dispatch"
label = "Running workers end to end"

[[concern]]
id = "gates"
label = "Catching bad work before it lands"

[[concern]]
id = "shared"
label = "Teams sharing one task state"

[[concern]]
id = "planning"
label = "Deciding what to work on"

[[concern]]
id = "visibility"
label = "Seeing what happened"

[[concern]]
id = "model"
label = "The task file itself"

# ---------------------------------------------------------------- approval
[[component]]
id = "approval.guard"
concern = "approval"
files = ["ergon/gates.py", "hooks/hooks.json"]
fns = ["guard_reason", "hook", "shell_commands", "git_commands", "human_cmd", "names_outside_data", "state_git_reason", "git_config_reason", "config_edit_reason", "config_write_reason", "config_source_reason", "config_file_reason", "git_config_entries", "git_config_sets", "git_url_args"]
terms = ["guard", "heredoc", "alias", "human-only verb", "refuses", "read-only mode", "agent edits"]
# introduced_by: guard_reason and hooks/hooks.json came with the initial import 1bbbb87; T-023 67d5131 only moved them
introduced_by = "none"

